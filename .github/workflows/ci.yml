name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build plugin bundle
        run: npm run build

      - name: Export image assets
        run: npm run images

      - name: Validate plugin folder
        run: npx --yes @elgato/cli@latest validate com.rimtty.totalmix-osc-remote.sdPlugin

      - name: Pack .streamDeckPlugin
        run: npx --yes @elgato/cli@latest pack com.rimtty.totalmix-osc-remote.sdPlugin --output dist

      - name: Upload packaged plugin
        uses: actions/upload-artifact@v4
        with:
          name: totalmix-osc-remote-plugin
          path: dist/*.streamDeckPlugin
